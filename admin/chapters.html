<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Đăng chương — Admin</title>
<link rel="stylesheet" href="/admin/admin.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
</head>
<body>
<div id="app"></div>
<script src="/admin/admin-common.js"></script>
<script>
let NOVELS = [];
let selectedNovelId = new URLSearchParams(location.search).get('novel') || '';
let DETECTED = [];      // [{title, content, num}]
let EXISTING = [];      // chương đã có trong DB của truyện đang chọn
let scheduleDays = [2,3,4,5]; // mặc định Thứ 3–Thứ 6, giống ví dụ Inkitt
let publishMode = 'scheduled'; // draft | scheduled | publish_now
let currentVolume = ''; // Quyển áp dụng cho đợt đăng chương này (vd "Quyển 1: Săn Ma")

// ── State cho khu vực xoá chương ──
let selectedChapterIds = new Set();
let volumeFilterDelete = '';

// ── State cho khu vực sửa chương ──
let editingChapter = null; // {id, title, content, volume, chapter_number, loading}

const DAY_LABELS = ['CN','T2','T3','T4','T5','T6','T7'];

/* ─── Tạm dừng / khởi động lại lịch đăng ───
   Chương đang 'scheduled' → bấm Tạm dừng → chuyển sang 'paused' (cron không đăng nữa).
   Bấm Khởi động lại → tính lại toàn bộ mốc đăng từ thời điểm hiện tại theo
   các ngày/giờ đã cài, rồi chuyển 'paused' → 'scheduled'. */
const TZ_OFFSET = { 'Asia/Bangkok': 7, 'Asia/Ho_Chi_Minh': 7, 'Asia/Shanghai': 8, 'UTC': 0 }; // không có DST
let resumeCfg = null; // {days, time, timezone, perSlot} — cấu hình dùng khi khởi động lại

const cfgKey = () => 'scheduleCfg:' + selectedNovelId;
function saveScheduleCfg(cfg) { try { localStorage.setItem(cfgKey(), JSON.stringify(cfg)); } catch (e) {} }
function loadScheduleCfg() { try { return JSON.parse(localStorage.getItem(cfgKey()) || 'null'); } catch (e) { return null; } }

const pad2 = n => String(n).padStart(2, '0');
function tzParts(ms, tz) {
  const d = new Date(ms + (TZ_OFFSET[tz] ?? 7) * 3600000);
  return { dow: d.getUTCDay(), hm: pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) };
}

// Đoán cấu hình lịch từ các mốc scheduled_at đang có (dự phòng khi chưa lưu cấu hình)
function inferScheduleCfg(list) {
  const tz = 'Asia/Bangkok';
  const times = list.map(c => new Date(c.scheduled_at).getTime()).filter(n => !isNaN(n));
  if (!times.length) return null;
  const days = new Set(), hmCount = {}, slotCount = {};
  times.forEach(t => {
    const p = tzParts(t, tz);
    days.add(p.dow);
    hmCount[p.hm] = (hmCount[p.hm] || 0) + 1;
    slotCount[t] = (slotCount[t] || 0) + 1;
  });
  return {
    days: [...days].sort(),
    time: Object.entries(hmCount).sort((a, b) => b[1] - a[1])[0][0],
    timezone: tz,
    perSlot: Math.max(...Object.values(slotCount)),
  };
}

// Sinh `count` mốc đăng (ISO) kể từ bây giờ theo cấu hình
function computeSlotTimes(count, cfg) {
  const off = (TZ_OFFSET[cfg.timezone] ?? 7) * 3600000;
  const [hh, mm] = (cfg.time || '17:00').split(':').map(Number);
  const now = Date.now();
  const local = new Date(now + off);
  let dayStart = Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate());
  const out = [];
  for (let guard = 0; out.length < count && guard < 4000; guard++, dayStart += 86400000) {
    const dow = new Date(dayStart).getUTCDay();
    const slotMs = dayStart + (hh * 60 + mm) * 60000 - off;
    if (cfg.days.includes(dow) && slotMs > now) {
      for (let k = 0; k < cfg.perSlot && out.length < count; k++) out.push(new Date(slotMs).toISOString());
    }
  }
  return out;
}

const byChapterNo = (a, b) => Number(a.chapter_number) - Number(b.chapter_number);

async function load() {
  // Nếu URL đã có ?novel=id (vd. bấm từ trang Truyện) thì gọi song song
  // /api/novels và /api/chapters ngay từ đầu thay vì chờ /api/novels xong
  // rồi mới gọi /api/chapters — tiết kiệm 1 vòng round-trip mạng.
  const preselected = selectedNovelId;
  const [n, ex] = await Promise.all([
    api('/api/novels'),
    preselected ? api(`/api/chapters?novel_id=${preselected}`) : Promise.resolve(null),
  ]);
  NOVELS = n.novels;
  if (!selectedNovelId && NOVELS.length) selectedNovelId = NOVELS[0].id;
  if (ex) {
    EXISTING = ex.chapters.sort((a, b) => Number(b.chapter_number) - Number(a.chapter_number));
  } else if (selectedNovelId) {
    await loadExisting();
  }
  render();
}

async function loadExisting() {
  const { chapters } = await api(`/api/chapters?novel_id=${selectedNovelId}`);
  EXISTING = chapters.sort((a,b) => Number(b.chapter_number) - Number(a.chapter_number));
}

function extractNum(title) {
  const m = title.match(/(?:chương|ch(?:apter)?\.?)\s*(\d+)|^(\d+)/i);
  if (m) return parseInt(m[1] || m[2]);
  const n = title.match(/\d+/);
  return n ? parseInt(n[0]) : null;
}

/* ─── Phát hiện chương trùng để THAY THẾ thay vì tạo mới ─── */
let autoReplace = true; // tự động chọn "thay thế" khi tìm thấy đúng 1 chương trùng

function normTitle(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

// Chương đã có mà file này có thể thay thế: trùng TÊN, hoặc trùng SỐ chương trong tên
// (nếu có nhập Quyển thì chỉ xét chương cùng quyển).
function findCandidates(d) {
  const vol = (currentVolume || '').trim();
  const sameVol = c => !vol || (c.volume || '') === vol;
  const t = normTitle(d.title);
  const byTitle = EXISTING.filter(c => normTitle(c.title) === t && sameVol(c));
  if (byTitle.length) return byTitle;
  if (d.num == null) return [];
  return EXISTING.filter(c => extractNum(c.title) === d.num && sameVol(c));
}

// 'new' = tạo chương mới, ngược lại = id chương sẽ bị thay thế
function resolveTarget(d) {
  if (d.target !== undefined) return d.target; // người dùng đã chọn tay
  if (!autoReplace) return 'new';
  const c = findCandidates(d);
  return c.length === 1 ? c[0].id : 'new';
}

function targetSelectHtml(d) {
  const cands = findCandidates(d);
  const target = resolveTarget(d);
  const note = (cands.length > 1 && target === 'new') ? ' (trùng nhiều chương — chọn tay)' : '';
  return `<select class="det-target" style="max-width:250px;flex-shrink:0">
    <option value="new" ${target === 'new' ? 'selected' : ''}>＋ Tạo chương mới${note}</option>
    ${cands.map(c => `<option value="${c.id}" ${target === c.id ? 'selected' : ''}>↻ Thay thế #${c.chapter_number} — ${escHtml(c.title)}</option>`).join('')}
  </select>`;
}

function submitLabel() {
  const rep = DETECTED.filter(d => resolveTarget(d) !== 'new').length;
  const n = DETECTED.length - rep;
  const parts = [];
  if (n) parts.push(publishMode === 'draft' ? `Lưu nháp ${n} chương mới` : publishMode === 'publish_now' ? `Đăng ngay ${n} chương mới` : `Lên lịch ${n} chương mới`);
  if (rep) parts.push(`thay thế ${rep} chương`);
  return parts.join(' + ');
}

/* ─── Parse 1 file .docx thành {title, content} ─── */
async function parseDocx(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  const raw = result.value.replace(/\r\n/g, '\n').trim();
  const lines = raw.split('\n').map(l => l.trim());
  const titleIdx = lines.findIndex(l => l.length > 0);
  const titleLine = titleIdx !== -1 ? lines[titleIdx] : file.name.replace(/\.docx$/i, '');
  const restLines = titleIdx !== -1 ? lines.slice(titleIdx + 1) : lines;
  const content = restLines.join('\n').trim();
  return { title: titleLine, content, num: extractNum(titleLine), _file: file.name };
}

function statusBadge(s) {
  const label = s === 'draft' ? 'Nháp' : s === 'scheduled' ? 'Đã lên lịch' : s === 'paused' ? 'Tạm dừng' : 'Đã đăng';
  return `<span class="status-badge status-${s}">${label}</span>`;
}

function render() {
  const novel = NOVELS.find(n => n.id === selectedNovelId);

  mountShell('chapters', `
    <div class="page-head">
      <div><h1>Đăng chương</h1><p>Tải file Word hàng loạt, hệ thống tự nhận diện tên chương và lên lịch đăng.</p></div>
    </div>

    <div class="card">
      <div class="field" style="max-width:420px">
        <label>Chọn truyện</label>
        <select id="novelSelect">
          ${NOVELS.map(n => `<option value="${n.id}" ${n.id===selectedNovelId?'selected':''}>${escHtml(n.title)}</option>`).join('')}
        </select>
      </div>
    </div>

    ${novel ? renderUploadCard() + renderScheduleControlCard() + renderDetectedCard() + renderScheduleCard() + renderEditCard() + renderExistingCard() : `<div class="card"><div class="empty">Chưa có truyện nào — tạo truyện trước ở trang "Truyện".</div></div>`}
  `);

  document.getElementById('novelSelect').addEventListener('change', async (e) => {
    selectedNovelId = e.target.value;
    resumeCfg = null;
    DETECTED = [];
    selectedChapterIds.clear();
    volumeFilterDelete = '';
    editingChapter = null;
    await loadExisting();
    render();
  });

  if (novel) bindInteractivity();
}

function renderUploadCard() {
  return `
    <div class="card">
      <h2>1. Tải file Word (.docx)</h2>
      <div class="dropzone" id="dropzone">
        <div class="icon">⇧</div>
        <p>Kéo thả nhiều file .docx vào đây, hoặc bấm để chọn file</p>
        <small>Dòng đầu tiên mỗi file được dùng làm tên chương, phần còn lại là nội dung.</small>
        <input type="file" id="fileInput" accept=".docx" multiple style="display:none"/>
      </div>
    </div>`;
}

function renderScheduleControlCard() {
  const paused = EXISTING.filter(c => c.status === 'paused').sort(byChapterNo);
  const scheduled = EXISTING.filter(c => c.status === 'scheduled' && c.scheduled_at)
    .sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  if (!paused.length && !scheduled.length) return '';

  if (!paused.length) {
    const next = scheduled[0];
    return `
      <div class="card">
        <h2>Lịch đăng đang chạy</h2>
        <p class="hint" style="margin-bottom:12px">
          ${scheduled.length} chương đang chờ đăng. Chương kế tiếp: <b>#${next.chapter_number}</b> lúc <span class="mono">${fmtDate(next.scheduled_at)}</span>.
          Khi bấm tạm dừng, các chương này sẽ ngừng đăng; lúc khởi động lại, lịch được tính lại từ thời điểm đó.
        </p>
        <button class="btn btn-gold" id="pauseScheduleBtn">⏸ Tạm dừng lịch đăng</button>
      </div>`;
  }

  if (!resumeCfg) {
    resumeCfg = loadScheduleCfg() || inferScheduleCfg(paused) ||
      { days: [...scheduleDays], time: '17:00', timezone: 'Asia/Bangkok', perSlot: 1 };
  }
  const cfg = resumeCfg;
  const first = cfg.days.length ? computeSlotTimes(1, cfg)[0] : null;
  return `
    <div class="card" style="border-left:3px solid var(--gold, #c9a227)">
      <h2>Lịch đăng đang tạm dừng</h2>
      <p class="hint" style="margin-bottom:14px">
        ${paused.length} chương đang tạm dừng (từ #${paused[0].chapter_number} đến #${paused[paused.length - 1].chapter_number}) sẽ không tự đăng.
        Khi khởi động lại, lịch được tính lại từ bây giờ theo các ngày/giờ bên dưới.
      </p>
      <div class="grid-2">
        <div class="field">
          <label>Các ngày đăng trong tuần</label>
          <div class="checkbox-row">
            ${DAY_LABELS.map((l, i) => `<span class="chip-toggle resume-day-chip ${cfg.days.includes(i) ? 'active' : ''}" data-rday="${i}">${l}</span>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Giờ đăng</label>
          <input type="time" id="resumeTime" value="${cfg.time}"/>
        </div>
        <div class="field">
          <label>Múi giờ</label>
          <select id="resumeTz">
            ${Object.keys(TZ_OFFSET).map(z => `<option value="${z}" ${z === cfg.timezone ? 'selected' : ''}>${z}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Số chương / mỗi lần đăng</label>
          <input type="number" id="resumePerSlot" value="${cfg.perSlot}" min="1"/>
        </div>
      </div>
      <p class="hint" style="margin:10px 0 14px">
        ${first ? `Chương #${paused[0].chapter_number} sẽ đăng đầu tiên vào <b class="mono">${fmtDate(first)}</b>.` : 'Hãy chọn ít nhất 1 ngày trong tuần.'}
      </p>
      <button class="btn btn-gold" id="resumeScheduleBtn" ${first ? '' : 'disabled'}>▶ Khởi động lại lịch đăng</button>
    </div>`;
}

function renderDetectedCard() {
  if (!DETECTED.length) return '';
  return `
    <div class="card">
      <h2>2. Chương đã nhận diện (${DETECTED.length})</h2>
      <p class="hint" style="margin-bottom:12px">Sắp xếp theo đúng thứ tự muốn đăng. Có thể sửa tên chương trước khi lưu. Chương nào trùng tên hoặc trùng số với chương đã có sẽ được đề xuất <b>thay thế nội dung</b> (giữ nguyên link và trạng thái đăng); bạn có thể đổi lại ở ô bên phải tên chương.</p>
      <label style="display:inline-flex;align-items:center;gap:6px;text-transform:none;font-size:13.5px;margin-bottom:14px">
        <input type="checkbox" id="autoReplaceChk" style="width:auto" ${autoReplace ? 'checked' : ''}/> Tự động thay thế chương trùng (đã có trên trang)
      </label>
      <div class="field" style="max-width:420px;margin-bottom:16px">
        <label>Quyển (tuỳ chọn — áp dụng cho cả ${DETECTED.length} chương này)</label>
        <input type="text" id="volumeInput" value="${escHtml(currentVolume)}" placeholder="VD: Quyển 1: Săn Ma"/>
      </div>
      <div id="detectedList">
        ${DETECTED.map((d, i) => `
          <div class="det-item" data-idx="${i}">
            <span class="num mono">#${i+1}</span>
            <input type="text" class="det-title" value="${escHtml(d.title)}"/>
            ${targetSelectHtml(d)}
            <span class="meta">${d.content.length} ký tự</span>
            <div class="actions">
              <button class="icon-btn" data-up="${i}" title="Lên">↑</button>
              <button class="icon-btn" data-down="${i}" title="Xuống">↓</button>
              <button class="icon-btn" data-remove="${i}" title="Bỏ">✕</button>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderScheduleCard() {
  if (!DETECTED.length) return '';
  return `
    <div class="card">
      <h2>3. Cách đăng</h2>
      <div class="checkbox-row" style="margin-bottom:16px">
        <span class="chip-toggle mode-chip ${publishMode==='draft'?'active':''}" data-mode="draft">Lưu nháp</span>
        <span class="chip-toggle mode-chip ${publishMode==='scheduled'?'active':''}" data-mode="scheduled">Lên lịch tự động</span>
        <span class="chip-toggle mode-chip ${publishMode==='publish_now'?'active':''}" data-mode="publish_now">Đăng ngay tất cả</span>
      </div>

      ${publishMode === 'scheduled' ? `
        <div class="grid-2">
          <div class="field">
            <label>Các ngày đăng trong tuần</label>
            <div class="checkbox-row" id="dayChips">
              ${DAY_LABELS.map((l, i) => `<span class="chip-toggle day-chip ${scheduleDays.includes(i)?'active':''}" data-day="${i}">${l}</span>`).join('')}
            </div>
          </div>
          <div class="field">
            <label>Giờ đăng</label>
            <input type="time" id="timeOfDay" value="17:00"/>
          </div>
          <div class="field">
            <label>Múi giờ</label>
            <select id="timezone">
              <option value="Asia/Bangkok" selected>Asia/Bangkok (UTC+7)</option>
              <option value="Asia/Ho_Chi_Minh">Asia/Ho_Chi_Minh (UTC+7)</option>
              <option value="Asia/Shanghai">Asia/Shanghai (UTC+8)</option>
              <option value="UTC">UTC</option>
            </select>
          </div>
          <div class="field">
            <label>Số chương / mỗi lần đăng</label>
            <input type="number" id="chaptersPerSlot" value="1" min="1"/>
          </div>
          <div class="field" style="grid-column:1/-1">
            <label>Bắt đầu lịch từ</label>
            <select id="startFrom">
              <option value="now">Ngay từ hôm nay (mốc gần nhất phù hợp)</option>
              <option value="after_last">Sau chương đã lên lịch/đăng gần nhất của truyện này</option>
            </select>
          </div>
        </div>
        <p class="hint">Ví dụ: chọn T3–T6, giờ 17:06 ⇒ mỗi Thứ 3, 4, 5, 6 sẽ tự động đăng 1 chương, giống lịch của Inkitt.</p>
        ${EXISTING.some(c => c.status === 'paused') ? `<p class="hint" style="color:var(--danger,#c0392b)">Truyện này đang tạm dừng lịch đăng — chương mới lên lịch ở đây sẽ vẫn tự đăng bình thường. Nếu muốn đăng cùng lịch đã dừng, hãy khởi động lại lịch trước.</p>` : ''}
      ` : ''}

      <div style="margin-top:16px">
        <button class="btn btn-gold" id="submitBtn">
          ${submitLabel()}
        </button>
      </div>
    </div>`;
}

function renderEditCard() {
  if (!editingChapter) return '';
  const ec = editingChapter;
  if (ec.loading) {
    return `<div class="card"><div class="empty">Đang tải nội dung chương...</div></div>`;
  }
  return `
    <div class="card" id="editCard">
      <h2>Sửa chương${ec.chapter_number != null ? ` #${ec.chapter_number}` : ''}</h2>
      <div class="field" style="margin-bottom:12px">
        <label>Tên chương</label>
        <input type="text" id="editTitle" value="${escHtml(ec.title)}"/>
      </div>
      <div class="field" style="margin-bottom:12px;max-width:420px">
        <label>Quyển</label>
        <input type="text" id="editVolume" value="${escHtml(ec.volume || '')}" placeholder="VD: Quyển 1: Săn Ma"/>
      </div>
      <div class="field" style="margin-bottom:16px">
        <label>Nội dung</label>
        <textarea id="editContent" rows="18" style="width:100%;font-family:inherit">${escHtml(ec.content || '')}</textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-gold" id="saveEditBtn">Lưu chương</button>
        <button class="btn" id="cancelEditBtn">Huỷ</button>
      </div>
    </div>`;
}

function renderExistingCard() {
  const volumes = [...new Set(EXISTING.map(c => c.volume).filter(Boolean))];
  const filtered = volumeFilterDelete
    ? EXISTING.filter(c => c.volume === volumeFilterDelete)
    : EXISTING;
  const allChecked = filtered.length > 0 && filtered.every(c => selectedChapterIds.has(c.id));

  return `
    <div class="card">
      <h2>Chương hiện có (${EXISTING.length})</h2>

      ${EXISTING.length ? `
        <div class="checkbox-row" style="margin-bottom:14px;align-items:center;gap:10px;flex-wrap:wrap">
          ${volumes.length ? `
            <select id="volumeFilterSelect" style="max-width:260px">
              <option value="">-- Tất cả quyển --</option>
              ${volumes.map(v => `<option value="${escHtml(v)}" ${v===volumeFilterDelete?'selected':''}>${escHtml(v)}</option>`).join('')}
            </select>
            <button class="btn btn-sm btn-danger" id="delByVolumeBtn" ${!volumeFilterDelete?'disabled':''}>
              Xoá cả quyển đang chọn
            </button>
          ` : ''}

          <button class="btn btn-sm btn-danger" id="delAllBtn">Xoá toàn bộ chương (${EXISTING.length})</button>

          ${selectedChapterIds.size ? `
            <button class="btn btn-sm btn-danger" id="delSelectedBtn">
              Xoá ${selectedChapterIds.size} chương đã chọn
            </button>
          ` : ''}
        </div>

        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAllChk" ${allChecked?'checked':''}/></th>
              <th>#</th><th>Tên chương</th><th>Quyển</th><th>Trạng thái</th><th>Thời gian</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(c => `
              <tr>
                <td><input type="checkbox" class="chk-row" data-id="${c.id}" ${selectedChapterIds.has(c.id)?'checked':''}/></td>
                <td class="mono">${c.chapter_number}</td>
                <td>${escHtml(c.title)}</td>
                <td style="color:var(--muted);font-size:12.5px">${c.volume ? escHtml(c.volume) : '—'}</td>
                <td>${statusBadge(c.status)}</td>
                <td class="mono" style="color:var(--muted);font-size:12.5px">
                  ${c.status === 'published' ? fmtDate(c.published_at) : c.status === 'scheduled' ? fmtDate(c.scheduled_at) : c.status === 'paused' ? 'Chờ khởi động lại' : '—'}
                </td>
                <td style="text-align:right;white-space:nowrap">
                  ${c.status !== 'published' ? `<button class="btn btn-sm" data-publish="${c.id}">Đăng ngay</button>` : `<button class="btn btn-sm" data-unpublish="${c.id}">Gỡ đăng</button>`}
                  <button class="btn btn-sm" data-edit="${c.id}">Sửa</button>
                  <button class="btn btn-sm btn-danger" data-delch="${c.id}">Xoá</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      ` : `<div class="empty">Truyện này chưa có chương nào.</div>`}
    </div>`;
}

function bindInteractivity() {
  const dz = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  if (dz) {
    dz.addEventListener('click', () => fileInput.click());
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('drag');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', e => handleFiles(e.target.files));
  }

  const volInput = document.getElementById('volumeInput');
  if (volInput) {
    volInput.addEventListener('input', e => { currentVolume = e.target.value; });
    volInput.addEventListener('change', () => render()); // quyển đổi → tính lại chương trùng
  }

  document.querySelectorAll('.det-title').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = e.target.closest('.det-item').dataset.idx;
      DETECTED[idx].title = e.target.value;
    });
    inp.addEventListener('change', e => {
      const d = DETECTED[e.target.closest('.det-item').dataset.idx];
      d.num = extractNum(d.title);
      d.target = undefined; // tên đổi → tính lại chương trùng
      render();
    });
  });
  document.querySelectorAll('.det-target').forEach(sel => {
    sel.addEventListener('change', e => {
      DETECTED[e.target.closest('.det-item').dataset.idx].target = e.target.value;
      render();
    });
  });
  const autoChk = document.getElementById('autoReplaceChk');
  if (autoChk) autoChk.addEventListener('change', e => {
    autoReplace = e.target.checked;
    DETECTED.forEach(d => { d.target = undefined; });
    render();
  });
  document.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => moveDetected(+b.dataset.up, -1)));
  document.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => moveDetected(+b.dataset.down, 1)));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => { DETECTED.splice(+b.dataset.remove, 1); render(); }));

  document.querySelectorAll('.mode-chip').forEach(chip => {
    chip.addEventListener('click', () => { publishMode = chip.dataset.mode; render(); });
  });
  document.querySelectorAll('.day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const d = +chip.dataset.day;
      scheduleDays = scheduleDays.includes(d) ? scheduleDays.filter(x => x !== d) : [...scheduleDays, d];
      render();
    });
  });

  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', submitBulk);

  // ── Tạm dừng / khởi động lại lịch đăng ──
  const pauseBtn = document.getElementById('pauseScheduleBtn');
  if (pauseBtn) pauseBtn.addEventListener('click', pauseSchedule);
  const resumeBtn = document.getElementById('resumeScheduleBtn');
  if (resumeBtn) resumeBtn.addEventListener('click', resumeSchedule);
  document.querySelectorAll('.resume-day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const d = +chip.dataset.rday;
      resumeCfg.days = resumeCfg.days.includes(d) ? resumeCfg.days.filter(x => x !== d) : [...resumeCfg.days, d].sort();
      render();
    });
  });
  const rTime = document.getElementById('resumeTime');
  if (rTime) rTime.addEventListener('change', e => { resumeCfg.time = e.target.value || '17:00'; render(); });
  const rTz = document.getElementById('resumeTz');
  if (rTz) rTz.addEventListener('change', e => { resumeCfg.timezone = e.target.value; render(); });
  const rPer = document.getElementById('resumePerSlot');
  if (rPer) rPer.addEventListener('change', e => { resumeCfg.perSlot = Math.max(1, parseInt(e.target.value || '1', 10)); render(); });

  document.querySelectorAll('[data-publish]').forEach(b => b.addEventListener('click', () => setChapterStatus(b.dataset.publish, 'published')));
  document.querySelectorAll('[data-unpublish]').forEach(b => b.addEventListener('click', () => setChapterStatus(b.dataset.unpublish, 'draft')));
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditChapter(b.dataset.edit)));
  document.querySelectorAll('[data-delch]').forEach(b => b.addEventListener('click', () => delChapter(b.dataset.delch)));

  const saveEditBtn = document.getElementById('saveEditBtn');
  if (saveEditBtn) saveEditBtn.addEventListener('click', saveEditChapter);
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if (cancelEditBtn) cancelEditBtn.addEventListener('click', cancelEdit);

  // ── Xoá theo quyển / toàn bộ / theo lựa chọn ──
  const volSel = document.getElementById('volumeFilterSelect');
  if (volSel) volSel.addEventListener('change', e => {
    volumeFilterDelete = e.target.value;
    render();
  });

  const delByVolumeBtn = document.getElementById('delByVolumeBtn');
  if (delByVolumeBtn) delByVolumeBtn.addEventListener('click', deleteByVolume);

  const delAllBtn = document.getElementById('delAllBtn');
  if (delAllBtn) delAllBtn.addEventListener('click', deleteAllChapters);

  const delSelectedBtn = document.getElementById('delSelectedBtn');
  if (delSelectedBtn) delSelectedBtn.addEventListener('click', deleteSelectedChapters);

  const selectAllChk = document.getElementById('selectAllChk');
  if (selectAllChk) selectAllChk.addEventListener('change', e => {
    const filtered = volumeFilterDelete ? EXISTING.filter(c => c.volume === volumeFilterDelete) : EXISTING;
    if (e.target.checked) filtered.forEach(c => selectedChapterIds.add(c.id));
    else filtered.forEach(c => selectedChapterIds.delete(c.id));
    render();
  });

  document.querySelectorAll('.chk-row').forEach(chk => {
    chk.addEventListener('change', e => {
      const id = e.target.dataset.id;
      if (e.target.checked) selectedChapterIds.add(id);
      else selectedChapterIds.delete(id);
      render();
    });
  });
}

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.docx'));
  if (!files.length) { toast('Vui lòng chọn file .docx', 'err'); return; }
  toast(`Đang đọc ${files.length} file...`);
  for (const f of files) {
    try {
      const parsed = await parseDocx(f);
      DETECTED.push(parsed);
    } catch (e) {
      toast(`Lỗi đọc ${f.name}: ${e.message}`, 'err');
    }
  }
  // sắp xếp theo số chương phát hiện được (nếu có), file nào không phát hiện được giữ nguyên cuối
  DETECTED.sort((a, b) => (a.num ?? 99999) - (b.num ?? 99999));
  render();
}

function moveDetected(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= DETECTED.length) return;
  [DETECTED[idx], DETECTED[j]] = [DETECTED[j], DETECTED[idx]];
  render();
}

async function submitBulk() {
  if (!DETECTED.length) return;
  const targets = DETECTED.map(resolveTarget);
  const used = targets.filter(t => t !== 'new');
  if (new Set(used).size !== used.length) { toast('Có 2 file cùng thay thế một chương — hãy chọn lại ở ô bên phải tên chương', 'err'); return; }
  if (used.length && !confirm(`${used.length} chương đã có sẽ bị GHI ĐÈ nội dung cũ bằng file mới. Tiếp tục?`)) return;
  const body = {
    novel_id: selectedNovelId,
    mode: publishMode,
    chapters: DETECTED.map((d, i) => ({
      title: d.title, content: d.content, volume: currentVolume || undefined,
      replace_id: targets[i] !== 'new' ? targets[i] : undefined,
    })),
  };
  if (publishMode === 'scheduled') {
    if (!scheduleDays.length) { toast('Chọn ít nhất 1 ngày trong tuần', 'err'); return; }
    body.schedule = {
      daysOfWeek: scheduleDays,
      timeOfDay: document.getElementById('timeOfDay').value || '17:00',
      timezone: document.getElementById('timezone').value,
      chaptersPerSlot: parseInt(document.getElementById('chaptersPerSlot').value || '1', 10),
      startFrom: document.getElementById('startFrom').value,
    };
    // Nhớ cấu hình lịch để dùng lại khi tạm dừng → khởi động lại
    saveScheduleCfg({
      days: [...scheduleDays].sort(),
      time: body.schedule.timeOfDay,
      timezone: body.schedule.timezone,
      perSlot: body.schedule.chaptersPerSlot,
    });
    resumeCfg = null;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Đang lưu...';
  try {
    const { chapters, replaced } = await api('/api/chapters-bulk', { method: 'POST', body });
    toast(`Đã tạo ${chapters.length} chương mới, thay thế ${(replaced || []).length} chương`, 'ok');
    DETECTED = [];
    await loadExisting();
    render();
  } catch (e) {
    toast('Lỗi: ' + e.message, 'err');
    btn.disabled = false;
  }
}

/* ─── Tạm dừng: mọi chương 'scheduled' của truyện → 'paused' ─── */
async function pauseSchedule() {
  const list = EXISTING.filter(c => c.status === 'scheduled');
  if (!list.length) return;
  if (!confirm(`Tạm dừng lịch đăng? ${list.length} chương đang chờ sẽ ngừng tự đăng cho tới khi bạn khởi động lại.`)) return;
  // Nếu chưa có cấu hình lưu sẵn thì ghi nhớ lại từ lịch hiện tại, vì lúc khởi động lại mốc cũ sẽ bị tính mới
  if (!loadScheduleCfg()) {
    const inferred = inferScheduleCfg(list);
    if (inferred) saveScheduleCfg(inferred);
  }
  try {
    const { paused } = await api('/api/chapters', {
      method: 'POST',
      body: { novel_id: selectedNovelId, action: 'pause' },
    });
    toast(`Đã tạm dừng ${paused ?? list.length} chương`, 'ok');
    resumeCfg = null;
    await loadExisting(); render();
  } catch (e) { toast('Lỗi: ' + e.message, 'err'); }
}

/* ─── Khởi động lại: tính lại mốc đăng từ bây giờ, chương nhỏ số đăng trước ─── */
async function resumeSchedule() {
  const list = EXISTING.filter(c => c.status === 'paused').sort(byChapterNo);
  if (!list.length || !resumeCfg) return;
  if (!resumeCfg.days.length) { toast('Chọn ít nhất 1 ngày trong tuần', 'err'); return; }
  const times = computeSlotTimes(list.length, resumeCfg);
  const items = list.map((c, i) => ({ id: c.id, scheduled_at: times[i] }));

  const btn = document.getElementById('resumeScheduleBtn');
  btn.disabled = true; btn.textContent = 'Đang khởi động lại...';
  try {
    const { resumed } = await api('/api/chapters', {
      method: 'POST',
      body: { novel_id: selectedNovelId, action: 'resume', items },
    });
    saveScheduleCfg(resumeCfg);
    toast(`Đã khởi động lại lịch cho ${resumed ?? items.length} chương`, 'ok');
    resumeCfg = null;
    await loadExisting(); render();
  } catch (e) {
    toast('Lỗi: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '▶ Khởi động lại lịch đăng';
  }
}

async function setChapterStatus(id, status) {
  try {
    await api(`/api/chapters?id=${id}`, { method: 'PUT', body: { status } });
    toast(status === 'published' ? 'Đã đăng chương' : 'Đã gỡ đăng', 'ok');
    await loadExisting(); render();
  } catch (e) { toast('Lỗi: ' + e.message, 'err'); }
}

/* ─── Sửa chương: mở form, tải nội dung đầy đủ, lưu lại qua PUT ─── */
async function openEditChapter(id) {
  editingChapter = { id, loading: true };
  render();
  try {
    // Lưu ý: API GET luôn trả về field số nhiều `chapters` (mảng),
    // kể cả khi lọc theo ?id= chỉ có đúng 1 phần tử — không có field `chapter` số ít.
    const { chapters } = await api(`/api/chapters?id=${id}`);
    const chapter = chapters && chapters[0];
    if (!chapter) throw new Error('Không tìm thấy chương');
    editingChapter = {
      id,
      title: chapter.title,
      content: chapter.content,
      volume: chapter.volume || '',
      chapter_number: chapter.chapter_number,
    };
  } catch (e) {
    toast('Lỗi tải chương: ' + e.message, 'err');
    editingChapter = null;
  }
  render();
  // cuộn tới form sửa cho dễ thấy
  document.getElementById('editCard')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelEdit() {
  editingChapter = null;
  render();
}

async function saveEditChapter() {
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value;
  const volume = document.getElementById('editVolume').value.trim();
  if (!title) { toast('Tên chương không được để trống', 'err'); return; }

  const btn = document.getElementById('saveEditBtn');
  btn.disabled = true; btn.textContent = 'Đang lưu...';
  try {
    await api(`/api/chapters?id=${editingChapter.id}`, {
      method: 'PUT',
      body: { title, content, volume: volume || null },
    });
    toast('Đã lưu chương', 'ok');
    editingChapter = null;
    await loadExisting();
    render();
  } catch (e) {
    toast('Lỗi: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Lưu chương';
  }
}

async function delChapter(id) {
  if (!confirm('Xoá chương này?')) return;
  try {
    await api(`/api/chapters?id=${id}`, { method: 'DELETE' });
    toast('Đã xoá chương', 'ok');
    await loadExisting(); render();
  } catch (e) { toast('Lỗi: ' + e.message, 'err'); }
}

/* ─── Xoá hàng loạt: gọi 1 API bulk-delete duy nhất (nhanh & an toàn hơn
   trên Vercel/Supabase so với việc bắn N request DELETE song song) ─── */
async function bulkDelete(payload) {
  try {
    const { deleted } = await api('/api/chapters', {
      method: 'DELETE',
      body: { novel_id: selectedNovelId, ...payload },
    });
    toast(`Đã xoá ${deleted} chương`, 'ok');
  } catch (e) {
    toast('Lỗi: ' + e.message, 'err');
  } finally {
    selectedChapterIds.clear();
    await loadExisting();
    render();
  }
}

async function deleteAllChapters() {
  if (!EXISTING.length) return;
  if (!confirm(`Xoá TOÀN BỘ ${EXISTING.length} chương của truyện này? Không thể hoàn tác.`)) return;
  await bulkDelete({ mode: 'all' });
}

async function deleteByVolume() {
  if (!volumeFilterDelete) return;
  const count = EXISTING.filter(c => c.volume === volumeFilterDelete).length;
  if (!count) return;
  if (!confirm(`Xoá toàn bộ ${count} chương thuộc "${volumeFilterDelete}"? Không thể hoàn tác.`)) return;
  await bulkDelete({ mode: 'volume', volume: volumeFilterDelete });
}

async function deleteSelectedChapters() {
  const ids = [...selectedChapterIds];
  if (!ids.length) return;
  if (!confirm(`Xoá ${ids.length} chương đã chọn? Không thể hoàn tác.`)) return;
  await bulkDelete({ mode: 'ids', ids });
}

bootAdmin('chapters', load);
