<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cài đặt — Admin</title>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div id="app"></div>
<script src="/admin/admin-common.js"></script>
<script>
let GATE_OPEN = true;
let ANNOUNCEMENT_TEXT = '';

async function load() {
  const [{ open }, ann] = await Promise.all([
    api('/api/auth-register?action=gate-status'),
    api('/api/auth-register?action=announcement-get'),
  ]);
  GATE_OPEN = open;
  ANNOUNCEMENT_TEXT = ann.text || '';
  render();
}

function render() {
  mountShell('settings', `
    <div class="page-head">
      <div><h1>Cài đặt</h1><p>Cấu hình chung cho toàn site.</p></div>
    </div>

    <div class="card">
      <h2>Cổng đăng ký nhận mã</h2>
      <p class="hint" style="margin-bottom:16px">
        Khi khoá, độc giả mới sẽ KHÔNG thể đăng ký để nhận mã truy cập nữa.
        Những người đã có mã vẫn đăng nhập bình thường. Có thể mở lại bất cứ lúc nào.
      </p>
      <div class="gate-row">
        <span class="gate-status ${GATE_OPEN ? 'is-open' : 'is-closed'}" id="gateStatusText">
          ${GATE_OPEN ? '● Đang MỞ — nhận đăng ký mới' : '● Đang KHOÁ — tạm ngừng đăng ký mới'}
        </span>
        <label class="switch">
          <input type="checkbox" id="gateSwitch" ${GATE_OPEN ? 'checked' : ''}/>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h2>Dòng thông báo chạy (trang chủ)</h2>
      <p class="hint" style="margin-bottom:16px">
        Hiện dưới banner đầu trang, trên mục "Thư Viện Truyện Đọc Nhiều". Để trống rồi lưu sẽ ẩn dòng thông báo.
      </p>
      <textarea id="annInput" rows="3" maxlength="500"
        placeholder="Ví dụ: Phòng Đọc Số 0 tạm bảo trì lúc 2h sáng ngày 30/08, mong lữ khách thông cảm..."
        style="width:100%;box-sizing:border-box;background:var(--black-3);border:1px solid var(--gold-border);border-radius:var(--radius);color:var(--white);font-family:'EB Garamond',serif;font-size:15px;padding:12px 14px;resize:vertical;outline:none;">${escHtml(ANNOUNCEMENT_TEXT)}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
        <span class="hint" id="annCount">${ANNOUNCEMENT_TEXT.length}/500</span>
        <button class="btn btn-gold" id="annSaveBtn">Lưu thông báo</button>
      </div>
    </div>
  `);

  document.getElementById('gateSwitch').addEventListener('change', onToggleGate);

  const annInput = document.getElementById('annInput');
  const annCount = document.getElementById('annCount');
  annInput.addEventListener('input', () => {
    annCount.textContent = `${annInput.value.length}/500`;
  });
  document.getElementById('annSaveBtn').addEventListener('click', onSaveAnnouncement);
}

async function onSaveAnnouncement() {
  const btn = document.getElementById('annSaveBtn');
  const text = document.getElementById('annInput').value.trim();
  btn.disabled = true;
  btn.textContent = 'Đang lưu...';
  try {
    const r = await api('/api/auth-register?action=announcement-set', {
      method: 'POST',
      body: { text },
    });
    ANNOUNCEMENT_TEXT = r.text || '';
    toast(text ? 'Đã lưu thông báo' : 'Đã ẩn dòng thông báo', 'ok');
  } catch (err) {
    toast('Lỗi: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Lưu thông báo';
  }
}

async function onToggleGate(e) {
  const wantOpen = e.target.checked;
  e.target.disabled = true;
  try {
    const { open } = await api(`/api/auth-register?action=gate-set&open=${wantOpen}`);
    GATE_OPEN = open;
    toast(open ? 'Đã MỞ cổng đăng ký' : 'Đã KHOÁ cổng đăng ký', 'ok');
  } catch (err) {
    // Rollback UI nếu lưu thất bại
    e.target.checked = !wantOpen;
    toast('Lỗi: ' + err.message, 'err');
  } finally {
    e.target.disabled = false;
    render();
  }
}

bootAdmin('settings', load);
</script>
</body>
</html>
