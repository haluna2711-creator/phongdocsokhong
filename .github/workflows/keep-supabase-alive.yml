name: Keep Supabase Alive

# Mục đích: Supabase Free Plan tự động PAUSE project nếu database không có
# hoạt động nào trong 7 ngày liên tục. Workflow này gọi API /api/novels
# (endpoint có sẵn của site, thật sự query vào bảng "novels" trong Supabase)
# đều đặn 2 lần/tuần để tạo hoạt động thật, tránh bị pause trước khi site
# mở cửa công khai.

on:
  schedule:
    # Chạy vào 00:00 UTC mỗi Thứ Hai và Thứ Năm (2 lần/tuần, đủ an toàn
    # so với ngưỡng 7 ngày của Supabase). Giờ UTC, không phải giờ Việt Nam
    # (UTC+7) — 00:00 UTC = 07:00 sáng giờ VN.
    - cron: '0 0 * * 1,4'
  # Cho phép bấm chạy tay từ tab Actions trên GitHub để test ngay lập tức
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/novels để giữ Supabase active
        run: |
          # Đổi URL bên dưới thành domain thật của site (Vercel hoặc domain riêng)
          SITE_URL="https://phongdocsokhong.vercel.app"

          echo "Đang gọi $SITE_URL/api/novels ..."
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" "$SITE_URL/api/novels")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Ping thành công — Supabase đã ghi nhận hoạt động."
          else
            echo "⚠️ Ping trả về mã lỗi $HTTP_CODE — kiểm tra lại URL hoặc trạng thái site."
            exit 1
          fi
